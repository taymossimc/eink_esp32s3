[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "tmads-control-plane"
version = "0.1.0"
description = "TMAds brokerage and control-plane MVP"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.12,<1",
  "pydantic-settings>=2.5,<3",
  "phonenumbers>=8.13,<10",
  "Pillow>=10,<13",
  "zxing-cpp>=3,<4",
  "cryptography>=43,<47",
  "rfc8785>=0.1,<1",
  "twilio>=9,<10",
  "stripe>=11,<15",
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["tmads_control_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101"]
