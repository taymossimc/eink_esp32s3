[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[project]
name = "tmads-edge-distributor"
version = "0.1.0"
description = "TMAds authenticated edge synchronization distributor"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.5,<3",
  "cryptography>=43,<47",
  "rfc8785>=0.1,<1",
  "python-multipart>=0.0.12,<1",
  "httpx>=0.27,<1",
  "pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.8,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["tmads_edge_distributor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../../shared", "../control-plane", "../settlement"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["E501", "S101", "B008"]
